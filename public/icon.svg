<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Método Questão Certa">
  <title>Método Questão Certa</title>
  <!-- Marca do produto: o alvo. A instituição entra pela paleta do app, não
       aqui — o mesmo ícone serve aos dois editais. -->
  <defs>
    <linearGradient id="chama" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c41f27"/>
      <stop offset="55%" stop-color="#f4560f"/>
      <stop offset="100%" stop-color="#ffab2e"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b1220"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="url(#chama)"/>

  <!-- Anéis grossos: o ícone precisa continuar legível a 16px na aba -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#ffffff" stroke-width="44"/>
  <circle cx="256" cy="256" r="60" fill="#ffffff"/>
</svg>
